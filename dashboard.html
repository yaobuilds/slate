<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          hourCycle: "h23",
          hour: "2-digit"
        }).formatToParts(new Date());
        var hour = 0;
        for (var i = 0; i < parts.length; i += 1) {
          if (parts[i].type === "hour") hour = Number(parts[i].value);
        }
        if (hour === 24) hour = 0;
        if (hour < 6) document.documentElement.classList.add("night");
      } catch (err) {
        /* The clock script applies the same window once it loads. */
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <title>Dashboard · TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/app/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ambient.css">
</head>
<body class="page-dashboard guest">
  <div id="stage" class="stage">
    <header class="nav">
      <a class="nav-link" href="index.html" data-focus>Home</a>
      <a class="nav-link is-current" href="dashboard.html" aria-current="page" tabindex="-1">Dashboard</a>
      <div class="nav-end">
        <p class="dwx" id="dwx"></p>
        <p class="guest-flag" id="guest-flag">Guest mode</p>
        <button type="button" class="guest-toggle" id="guest-toggle" aria-pressed="false">Show all</button>
      </div>
    </header>

    <section class="panel box panel-today" id="panel-today" aria-labelledby="today-label">
      <h2 class="kicker" id="today-label">Today</h2>
      <ul class="rows" id="today-list"></ul>
    </section>

    <section class="panel box panel-deadlines" id="panel-deadlines" aria-labelledby="deadlines-label" hidden>
      <h2 class="kicker" id="deadlines-label">Deadlines</h2>
      <ul class="rows" id="deadlines-list"></ul>
    </section>

    <section class="panel box panel-money" id="panel-money" aria-labelledby="money-label" hidden>
      <h2 class="kicker" id="money-label">Money</h2>
      <p class="money-note" id="money-note"></p>
    </section>
  </div>
  <form id="pin-form" class="pin-form" hidden autocomplete="off">
    <p class="pin-title">Enter the PIN from this Mac</p>
    <label class="pin-label" for="pin-input">PIN</label>
    <input id="pin-input" name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="done">
    <button type="submit">Unlock</button>
    <p id="pin-error" class="pin-error" role="status"></p>
  </form>
  <script src="main.js"></script>
  <script src="dashboard.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
