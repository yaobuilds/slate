<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          hourCycle: "h23",
          hour: "2-digit"
        }).formatToParts(new Date());
        var hour = 0;
        for (var i = 0; i < parts.length; i += 1) {
          if (parts[i].type === "hour") hour = Number(parts[i].value);
        }
        if (hour === 24) hour = 0;
        if (hour < 6) document.documentElement.classList.add("night");
      } catch (err) {
        /* The clock script applies the same window once it loads. */
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <title>Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/app/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ambient.css">
</head>
<body class="page-dashboard guest">
  <div id="stage" class="stage">
    <header class="dash-header">
      <a class="home-pill focusable" href="index.html" data-focus>
        <span class="home-pill-icon" id="home-pill-icon" aria-hidden="true"></span>
        <span>Home</span>
      </a>
      <p class="dash-date" id="dash-date"></p>
      <div class="dash-header-end">
        <p class="dwx" id="dwx"></p>
        <p class="dash-clock" id="dash-clock"></p>
      </div>
      <p class="data-stale" id="data-stale" hidden></p>
    </header>

    <a class="panel box panel-today calendar-panel-link" id="panel-today" href="calendar.html" aria-labelledby="today-label" data-focus>
      <div class="panel-heading-row">
        <h2 class="kicker" id="today-label">Now / Next</h2>
        <span class="panel-open">Open calendar</span>
      </div>
      <p class="guest-pill" id="guest-pill" hidden>
        <span class="guest-pill-icon" id="guest-pill-icon" aria-hidden="true"></span>
        <span>Guest mode</span>
      </p>
      <ul class="rows" id="today-list"></ul>
    </a>

    <a class="panel box panel-upcoming calendar-panel-link" id="panel-upcoming" href="calendar.html#week" aria-labelledby="upcoming-label" data-focus>
      <div class="panel-heading-row">
        <h2 class="kicker" id="upcoming-label">Upcoming</h2>
        <span class="panel-open">Week view</span>
      </div>
      <ul class="rows" id="upcoming-list"></ul>
    </a>

    <section class="headlines" id="headlines" hidden aria-label="News">
      <ul class="headline-list" id="headline-list"></ul>
    </section>

    <footer class="foot dash-foot">
      <div class="hints">
        <span class="hint hint-keys"><span class="cap">Enter</span>Open</span>
        <span class="hint hint-keys"><span class="cap">G</span><span id="guest-hint">Show all</span></span>
        <button type="button" class="guest-toggle" id="guest-toggle" aria-pressed="false">Show all</button>
      </div>
      <div class="foot-end">
        <a class="foot-link" href="network.html">Wi-Fi / LAN</a>
        <a class="foot-link" href="settings.html">Settings</a>
        <p class="signature">
          <img src="assets/shift-a-slate-dim.svg" width="31" height="20" alt="">
          <span>by Yao</span>
        </p>
      </div>
    </footer>
  </div>
  <form id="pin-form" class="pin-form" hidden autocomplete="off">
    <p class="pin-title">Enter the PIN from this Mac</p>
    <label class="pin-label" for="pin-input">PIN</label>
    <input id="pin-input" name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="done">
    <button type="submit">Unlock</button>
    <p id="pin-error" class="pin-error" role="status"></p>
  </form>
  <script src="main.js"></script>
  <script src="dashboard.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
