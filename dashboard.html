<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          hourCycle: "h23",
          hour: "2-digit"
        }).formatToParts(new Date());
        var hour = 0;
        for (var i = 0; i < parts.length; i += 1) {
          if (parts[i].type === "hour") hour = Number(parts[i].value);
        }
        if (hour === 24) hour = 0;
        if (hour < 6) document.documentElement.classList.add("night");
      } catch (err) {
        /* The clock script applies the same window once it loads. */
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <title>Dashboard · TV</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ambient.css">
</head>
<body class="page-dashboard guest">
  <div id="stage" class="stage">
    <header class="nav">
      <a class="nav-link" href="index.html" data-focus>Home</a>
      <a class="nav-link is-current" href="dashboard.html" aria-current="page" tabindex="-1">Dashboard</a>
      <div class="nav-end">
        <p class="dwx" id="dwx"></p>
        <p class="guest-flag" id="guest-flag">Guest mode</p>
      </div>
    </header>

    <section class="panel box panel-today" id="panel-today" aria-labelledby="today-label">
      <h2 class="kicker" id="today-label">Today</h2>
      <ul class="rows" id="today-list"></ul>
    </section>

    <section class="panel box panel-deadlines" id="panel-deadlines" aria-labelledby="deadlines-label" hidden>
      <h2 class="kicker" id="deadlines-label">Deadlines</h2>
      <ul class="rows" id="deadlines-list"></ul>
    </section>

    <section class="panel box panel-money" id="panel-money" aria-labelledby="money-label" hidden>
      <h2 class="kicker" id="money-label">Money</h2>
      <p class="money-note" id="money-note"></p>
    </section>
  </div>
  <script src="main.js"></script>
  <script src="dashboard.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
