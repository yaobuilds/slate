<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <title>Home · TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage" class="stage">
    <header class="nav">
      <a class="nav-link is-current" href="index.html" aria-current="page">Home</a>
    </header>

    <section class="hero" aria-label="Clock">
      <p class="clock">
        <span id="clock-hm">--:--</span><span class="clock-sec" id="clock-sec"></span>
        <span class="clock-ampm" id="clock-ampm"></span>
      </p>
      <p class="date" id="date">New York, NY</p>
    </section>

    <aside class="weather" id="weather" aria-label="Weather for New York, NY">
      <p class="kicker">Weather</p>
      <p class="place">New York, NY</p>
      <p class="temp" id="weather-temp"></p>
      <ol class="hours" id="weather-hours"></ol>
    </aside>

    <section class="apps" id="apps" aria-label="Apps">
      <div class="tile-slot"></div>
      <div class="tile-slot"></div>
      <div class="tile-slot"></div>
      <div class="tile-slot"></div>
      <div class="tile-slot"></div>
    </section>
  </div>
  <script src="main.js"></script>
</body>
</html>
