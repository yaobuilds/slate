<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          hourCycle: "h23",
          hour: "2-digit"
        }).formatToParts(new Date());
        var hour = 0;
        for (var i = 0; i < parts.length; i += 1) {
          if (parts[i].type === "hour") hour = Number(parts[i].value);
        }
        if (hour === 24) hour = 0;
        if (hour < 6) document.documentElement.classList.add("night");
      } catch (err) {
        /* The clock script applies the same window once it loads. */
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <title>Home · TV</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-home">
  <div id="stage" class="stage">
    <header class="nav">
      <a class="nav-link is-current" href="index.html" aria-current="page" data-focus>Home</a>
      <a class="nav-link" href="dashboard.html" data-focus>Dashboard</a>
    </header>

    <section class="hero" aria-label="Clock">
      <p class="clock">
        <span id="clock-hm">--:--</span><span class="clock-sec" id="clock-sec"></span>
        <span class="clock-ampm" id="clock-ampm"></span>
      </p>
      <p class="date" id="date">New York, NY</p>
    </section>

    <aside class="weather" id="wx" aria-label="Weather in New York, NY" style="visibility: hidden">
      <p class="wx-place">New York, NY</p>
      <div class="wx-now"><span id="wx-icon"></span><p class="wx-temp" id="wx-temp"></p></div>
      <p class="wx-cond" id="wx-cond"></p>
      <div class="wx-hours" id="wx-hours"></div>
      <p class="wx-stale" id="wx-stale"></p>
    </aside>

    <nav class="tiles" id="tiles" aria-label="Apps"></nav>
    <footer class="foot">
      <div class="hints">
        <span class="hint"><span class="cap">← →</span>Move</span>
        <span class="hint"><span class="cap">Enter</span>Open</span>
      </div>
    </footer>
  </div>
  <script src="main.js"></script>
</body>
</html>
