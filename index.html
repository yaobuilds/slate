<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          hourCycle: "h23",
          hour: "2-digit"
        }).formatToParts(new Date());
        var hour = 0;
        for (var i = 0; i < parts.length; i += 1) {
          if (parts[i].type === "hour") hour = Number(parts[i].value);
        }
        if (hour === 24) hour = 0;
        if (hour < 6) document.documentElement.classList.add("night");
      } catch (err) {
        /* The clock script applies the same window once it loads. */
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slate">
  <title>Home</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/app/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/app/apple-touch-icon.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ambient.css">
</head>
<body class="page-home">
  <div id="stage" class="stage">
    <section class="hero" aria-label="Clock">
      <p class="clock">
        <span id="clock-hm">--:--</span>
        <span class="clock-ampm" id="clock-ampm"></span>
      </p>
      <p class="date" id="date"></p>
    </section>

    <a class="home-settings focusable" href="settings.html">Settings</a>

    <aside class="weather" id="wx" aria-label="Weather in New York, NY" style="visibility: hidden">
      <p class="wx-place">New York, NY</p>
      <div class="wx-now"><span id="wx-icon"></span><p class="wx-temp" id="wx-temp"></p></div>
      <p class="wx-cond" id="wx-cond"></p>
      <div class="wx-hours" id="wx-hours"></div>
      <p class="wx-stale" id="wx-stale"></p>
    </aside>

    <nav class="tiles" id="tiles" aria-label="Apps"></nav>
    <footer class="foot">
      <div class="hints">
        <span class="hint hint-keys"><span class="cap">← →</span>Move</span>
        <span class="hint hint-keys"><span class="cap">Enter</span>Open</span>
        <span class="hint hint-touch">Tap a tile</span>
      </div>
      <div class="foot-end">
        <a class="foot-link focusable" href="settings.html" tabindex="0">Settings</a>
        <p class="signature">
          <img src="assets/shift-a-slate-dim.svg" width="31" height="20" alt="">
          <span>by Yao</span>
        </p>
      </div>
    </footer>
  </div>
  <script src="main.js"></script>
  <script src="ambient.js"></script>
</body>
</html>
