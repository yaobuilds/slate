<!DOCTYPE html>
<html lang="en" class="page-settings">
<head>
  <meta charset="utf-8">
  <script src="slate-surface.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <title>News sources · Settings</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="tv-appearance.css">
</head>
<body>
  <div class="settings-stage">
    <header class="settings-head">
      <a class="settings-back" href="settings.html"><span class="back-arrow" aria-hidden="true">←</span>Settings</a>
      <h1 class="settings-title">News sources</h1>
    </header>
    <section class="settings-panel">
      <p class="settings-count">Dashboard headline strip</p>
      <h2 class="settings-subtitle">Included sources</h2>
      <ul class="settings-list" id="headlines-builtin"></ul>
      <h2 class="settings-subtitle">Your feeds</h2>
      <p class="settings-lan-copy" id="headlines-custom-count">0 custom feeds</p>
      <ul class="settings-list" id="headlines-custom"></ul>
      <div class="settings-tile-layout" id="headlines-add-block">
        <div>
          <h2 class="settings-subtitle">Add a feed</h2>
          <p class="settings-lan-copy">Short name and an https RSS link. Up to 8 custom feeds.</p>
        </div>
        <div class="settings-pin-fields">
          <label class="pin-label" for="headlines-name">Name</label>
          <input id="headlines-name" class="settings-field" type="text" maxlength="32" autocomplete="off">
          <label class="pin-label" for="headlines-url">RSS URL</label>
          <input id="headlines-url" class="settings-field" type="url" inputmode="url" autocomplete="off" placeholder="https://">
          <div class="settings-actions">
            <button type="button" id="headlines-add">Add feed</button>
          </div>
        </div>
      </div>
      <div class="settings-actions">
        <button type="button" id="headlines-save">Save</button>
      </div>
      <p class="settings-msg" id="headlines-msg" role="status"></p>
    </section>
  </div>
  <form id="settings-pin-form" class="settings-pin-form" hidden autocomplete="off">
    <p class="pin-title">Enter the PIN from this Mac</p>
    <label class="pin-label" for="settings-pin-input">PIN</label>
    <input id="settings-pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button type="submit">Unlock</button>
    <p id="settings-pin-error" class="pin-error" role="status"></p>
  </form>
  <script src="settings.js"></script>
  <script src="settings-headlines.js"></script>
  <script src="tv-appearance.js"></script>
  <script src="remote-consumer.js"></script>
</body>
</html>
