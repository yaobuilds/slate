<!DOCTYPE html>
<html lang="en" class="page-settings">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <title>Schedule · Settings</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-stage">
    <header class="settings-head">
      <h1 class="settings-title">Schedule</h1>
      <a class="settings-back" href="settings.html">Back</a>
    </header>
    <section class="settings-panel">
      <h2 class="settings-subtitle">Today</h2>
      <div class="settings-editor" id="today-editor"></div>
      <button type="button" class="settings-add" id="today-add">Add</button>

      <h2 class="settings-subtitle" style="margin-top:28px">Deadlines</h2>
      <p class="settings-lan-copy">Use a calendar date. Dashboard shows the weekday and a countdown.</p>
      <div class="settings-editor" id="deadline-editor"></div>
      <button type="button" class="settings-add" id="deadline-add">Add</button>

      <h2 class="settings-subtitle" style="margin-top:28px">Money</h2>
      <p class="settings-lan-copy">Status words only. No dollar amounts.</p>
      <textarea class="settings-field note" id="money-note" maxlength="200" rows="3"></textarea>

      <div class="settings-actions">
        <button type="button" id="schedule-save">Save</button>
      </div>
      <p class="settings-msg" id="schedule-msg" role="status"></p>
    </section>
  </div>
  <form id="settings-pin-form" class="settings-pin-form" hidden autocomplete="off">
    <p class="pin-title">Enter the PIN from this Mac</p>
    <label class="pin-label" for="settings-pin-input">PIN</label>
    <input id="settings-pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button type="submit">Unlock</button>
    <p id="settings-pin-error" class="pin-error" role="status"></p>
  </form>
  <script src="settings.js"></script>
  <script src="settings-schedule.js"></script>
</body>
</html>
