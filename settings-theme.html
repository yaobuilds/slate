<!DOCTYPE html>
<html lang="en" class="page-settings page-appearance">
<head>
  <meta charset="utf-8">
  <script src="slate-surface.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <title>Appearance · Settings</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="tv-appearance.css">
</head>
<body>
  <div class="settings-stage appearance-stage">
    <header class="settings-head">
      <a class="settings-back" href="settings.html"><span class="back-arrow" aria-hidden="true">←</span>Settings</a>
      <h1 class="settings-title">Appearance</h1>
    </header>
    <div class="appearance-workspace">
      <div class="appearance-controls">
        <section class="appearance-section">
          <h2 id="look-heading">Home look</h2>
          <div class="look-cards" id="appearance-styles" role="radiogroup" aria-labelledby="look-heading"></div>
        </section>
        <section class="appearance-section" id="color-section">
          <div class="appearance-section-head">
            <h2 id="color-heading">Colors</h2>
            <p class="appearance-hint" id="color-hint">Also used on Dashboard and other devices</p>
          </div>
          <div class="palette-chips" id="appearance-colors" role="radiogroup" aria-labelledby="color-heading"></div>
        </section>
      </div>
      <aside class="appearance-preview-area" aria-label="Home preview">
        <div class="appearance-preview" id="appearance-preview" data-style="sculptural">
          <div class="preview-backdrop tv-backdrop" id="preview-backdrop" aria-hidden="true"></div>
          <div class="preview-hero"><span>9:41</span><small>Wednesday, October 28</small></div>
          <div class="preview-weather"><span class="preview-wx-icon" data-icon="cloud"></span>62°<small>Cloudy</small></div>
          <div class="preview-settings">Settings</div>
          <div class="preview-dock">
            <span><i data-icon="grid"></i><small>Dashboard</small></span>
            <span><i data-icon="film"></i><small>Netflix</small></span>
            <span><i data-icon="tv"></i><small>YouTube</small></span>
          </div>
        </div>
        <p class="appearance-caption"><strong id="appearance-name">Sculptural Light</strong><span id="appearance-description">Deep ink and luminous forms.</span></p>
        <section class="appearance-section appearance-inline">
          <h2 id="motion-heading">Motion</h2>
          <div class="appearance-options appearance-three" id="appearance-motion" role="radiogroup" aria-labelledby="motion-heading"></div>
        </section>
        <p class="appearance-note" id="motion-description">Slow, continuous movement.</p>
        <section class="appearance-section appearance-inline">
          <h2 id="intensity-heading">Intensity</h2>
          <div class="appearance-options appearance-three" id="appearance-intensity" role="radiogroup" aria-labelledby="intensity-heading"></div>
        </section>
      </aside>
    </div>
    <div class="appearance-save">
      <p class="settings-msg" id="theme-msg" role="status"></p>
      <button type="button" id="theme-save" class="button-primary">Save and open Home</button>
    </div>
  </div>
  <form id="settings-pin-form" class="settings-pin-form" hidden autocomplete="off">
    <p class="pin-title">Enter the PIN from this Mac</p>
    <label class="pin-label" for="settings-pin-input">PIN</label>
    <input id="settings-pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
    <button type="submit">Unlock</button>
    <p id="settings-pin-error" class="pin-error" role="status"></p>
  </form>
  <script src="settings.js"></script>
  <script src="tv-appearance.js"></script>
  <script src="settings-theme.js"></script>
</body>
</html>
