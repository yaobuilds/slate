<!DOCTYPE html>
<html lang="en" class="page-settings">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <title>Settings</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-stage">
    <header class="settings-head">
      <h1 class="settings-title">Settings</h1>
      <a class="settings-back" href="index.html">Back to Home</a>
    </header>
    <nav class="settings-panel" aria-label="Settings sections">
      <a class="settings-hub-link" href="settings-apps.html">Home apps<span aria-hidden="true">→</span></a>
      <a class="settings-hub-link" href="settings-theme.html" style="margin-top:16px">Theme<span aria-hidden="true">→</span></a>
      <a class="settings-hub-link" href="settings-location.html" style="margin-top:16px">Location<span aria-hidden="true">→</span></a>
    </nav>
    <section class="settings-panel settings-lan-panel">
      <h2 class="settings-subtitle">Wi-Fi session</h2>
      <p class="settings-lan-copy">When Slate runs with <code>--lan</code>, unlocking Show all on Dashboard sets a cookie on this iPad or phone. Sign out clears it so the schedule asks for the PIN again.</p>
      <div class="settings-actions">
        <button type="button" id="settings-sign-out">Sign out on Wi-Fi</button>
      </div>
      <p class="settings-msg" id="sign-out-msg" role="status"></p>
    </section>
  </div>
  <script src="settings.js"></script>
</body>
</html>
