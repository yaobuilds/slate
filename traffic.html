<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10141A">
  <title>Traffic</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="tv-appearance.css">
  <link rel="stylesheet" href="traffic.css">
  <script src="slate-surface.js"></script>
  <script src="slate-place.js"></script>
  <script src="slate-locate.js"></script>
</head>
<body class="page-traffic">
  <main class="traffic-shell" id="traffic-shell">
    <header class="traffic-head">
      <a class="traffic-back" href="index.html" data-tr-focus>Home</a>
      <div class="traffic-title-block">
        <p class="traffic-eyebrow" id="traffic-place">Traffic</p>
        <h1 id="traffic-heading">Live map</h1>
      </div>
      <p class="traffic-updated" id="traffic-updated"></p>
    </header>

    <p class="traffic-quiet" id="traffic-quiet" hidden></p>

    <div class="traffic-body" id="traffic-body">
      <section class="traffic-map-panel" aria-label="Map">
        <div class="traffic-map-frame">
          <div class="traffic-zoom">
            <button type="button" class="traffic-zoom-btn" id="traffic-zoom-in" data-tr-focus aria-label="Zoom in">+</button>
            <button type="button" class="traffic-zoom-btn" id="traffic-zoom-out" data-tr-focus aria-label="Zoom out">−</button>
          </div>
          <div class="traffic-map" id="traffic-map" tabindex="0" data-tr-focus aria-label="Map. Arrows pan, Enter zooms in, and Back resets the view.">
            <div class="traffic-tiles" id="traffic-tiles"></div>
            <span class="traffic-center" id="traffic-center" aria-hidden="true"></span>
            <div class="traffic-markers" id="traffic-markers"></div>
            <div class="traffic-speeds" id="traffic-speeds"></div>
          </div>
        </div>
        <p class="traffic-map-note" id="traffic-map-note" hidden></p>
        <p class="traffic-map-note" id="traffic-incidents-note" hidden></p>
        <p class="traffic-map-note" id="traffic-speeds-note" hidden></p>
      </section>
      <aside class="traffic-incidents" aria-labelledby="traffic-incidents-title">
        <h2 id="traffic-incidents-title">Incidents nearby</h2>
        <ul class="traffic-incident-list" id="traffic-incident-list"></ul>
      </aside>
    </div>

    <footer class="traffic-foot">
      <p class="traffic-attribution" id="traffic-attribution">
        Map tiles © <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors, © <a href="https://carto.com/attributions" rel="noopener noreferrer">CARTO</a>
      </p>
    </footer>
  </main>
  <script src="traffic.js"></script>
  <script src="tv-appearance.js"></script>
  <script src="remote-consumer.js"></script>
</body>
</html>
